name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Require Docker for the integration contract
        run: docker info > /dev/null
      - name: Backend unit and real-service integration tests
        run: mvn -B -ntp clean verify
      - name: Assert integration tests actually ran
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse('target/failsafe-reports/TEST-dev.collab.integration.ContainerCollaborationIT.xml').getroot()
          assert int(r.attrib['tests']) >= 17 and int(r.attrib['skipped']) == 0
          PY
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm run typecheck
          npm run format:check
          npm test
          npm run build
          npm audit --audit-level=low
      - name: Scan runtime JVM dependencies
        run: |
          mvn -B -ntp dependency:tree -DoutputType=json -DoutputFile=target/dependency-tree.json
          node scripts/audit-runtime.mjs
      - name: Secret scan
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --no-banner
      - name: Compose build and smoke
        run: |
          node scripts/init-env.mjs
          docker compose config --quiet
          docker compose up -d --build
          for attempt in $(seq 1 60); do if curl -fsS http://localhost:8080/actuator/health/readiness; then break; fi; sleep 2; done
          curl -fsS http://localhost:8080/actuator/health/readiness
          curl -fsS http://localhost:5173/ > /dev/null
          node scripts/smoke.mjs
      - name: Stop test stack
        if: always()
        run: if [ -f .env ]; then docker compose down; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/runtime-audit.json
          retention-days: 7
