name: collaborative-editor
x-backend: &backend
  build: .
  environment: &backend-env
    DATABASE_URL: jdbc:postgresql://postgres:5432/editor
    DATABASE_USER: editor
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run node scripts/init-env.mjs}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Run node scripts/init-env.mjs}
    JWT_SECRET: ${JWT_SECRET:?Run node scripts/init-env.mjs}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 1g
  restart: unless-stopped
  healthcheck:
    test: [CMD, curl, -fsS, http://localhost:8080/actuator/health/readiness]
    interval: 5s
    timeout: 3s
    start_period: 40s
    retries: 30
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: editor
      POSTGRES_USER: editor
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run node scripts/init-env.mjs}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U editor -d editor']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped
  redis:
    image: redis:8.2-alpine
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --save "" --appendonly no']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run node scripts/init-env.mjs}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run node scripts/init-env.mjs}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped
  backend:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-a
    ports: ['127.0.0.1:8080:8080']
  backend-b:
    <<: *backend
    profiles: [multi]
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-b
    ports: ['127.0.0.1:8082:8080']
  frontend:
    build: frontend
    ports: ['127.0.0.1:5173:8080']
    depends_on:
      backend: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
